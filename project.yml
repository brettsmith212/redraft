name: Redraft

options:
  bundleIdPrefix: com.brettsmith
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Redraft:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Tools/redraft
        buildPhase: resources
    dependencies:
      - package: Markdown
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Redraft
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle updates: the feed, the public half of the update-signing key
        # (private half is in the release machine's Keychain, account "redraft"), and checking on
        # by default (about once a day).
        SUFeedURL: https://raw.githubusercontent.com/brettsmith212/redraft/main/appcast.xml
        SUPublicEDKey: aHAvjbFmcE8X56MmOsuLh6VfpMoBJW/541IjQZX58rc=
        SUEnableAutomaticChecks: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brettsmith.Redraft
        PRODUCT_NAME: Redraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Everyday builds use the Apple Development certificate: a stable
        # identity, so the Keychain doesn't re-ask after rebuilds.
        # `make dmg` signs with Developer ID for sharing.
        DEVELOPMENT_TEAM: KFY97BH6J8
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

schemes:
  Redraft:
    build:
      targets:
        Redraft: all
    run:
      config: Debug
    archive:
      config: Release
